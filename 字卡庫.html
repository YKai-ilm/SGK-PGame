<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三國走圖塔防｜字卡庫</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c17;color:#e5e6d3;font:13px system-ui,'Microsoft JhengHei',sans-serif}button{font:inherit;cursor:pointer;color:inherit;background:#293d31;border:1px solid #68745b;border-radius:6px;min-height:34px;padding:6px 10px}button:disabled{opacity:.45;cursor:default}button.active{background:#79663e;border-color:#e4ca83}h1{font-size:19px;margin:0}h2{font-size:15px;margin:0 0 10px}p{font-size:12px;color:#b6c2aa;line-height:1.6;margin:7px 0}.top{padding:12px 16px;border-bottom:1px solid #40513d;display:flex;justify-content:space-between;gap:10px}.content{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px;padding:14px 16px}.filters{display:flex;gap:6px;margin-bottom:12px}.collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:9px}.collection button{min-height:75px;background:#23372b;position:relative;padding:9px}.name{display:inline-block;background:#fff;color:#000;border:1px solid #000;padding:2px 8px;white-space:nowrap;font-weight:400}.collection small{display:block;color:#c7d0bb;margin-top:7px;font-size:10px}.collection .chosen{outline:2px solid #e4c279;outline-offset:1px}.pick{position:absolute;right:4px;top:2px;color:#ffe8b0;font-size:10px}.side{border:1px solid #526146;border-radius:8px;padding:12px;background:#1c2c22;align-self:start}.roster{line-height:1.9;color:#edda9e;min-height:34px}.side button{margin:5px 0;width:100%}.hint{font-size:11px;color:#b4c3a9}.primary{background:#79663e}#notice{color:#e8cc8d}dialog{max-width:370px;background:#203329;color:#ede5cb;border:1px solid #beaa76;border-radius:10px;padding:18px}dialog::backdrop{background:#0008}@media(max-width:600px){.content{grid-template-columns:1fr}.collection{grid-template-columns:repeat(3,1fr)}.top{padding:10px 12px}.content{padding:12px}.side{margin-bottom:12px}}
.save-actions{display:flex;gap:6px}.save-actions button{min-width:0;font-size:12px}.training-level{display:block;margin-top:7px!important;padding:5px 2px;background:#e3ebd2;border-radius:4px;font-size:14px!important;line-height:1.5;color:#29452d!important}.training-level.empty{background:transparent;color:#7b856f!important;font-size:11px!important}</style><link rel="stylesheet" href="遊戲字體.css?v=20261107-1"></head><body><div class="top"><div><h1>字卡庫</h1><p>本場卡片 · 等級與候選武將</p></div><button id="back">返回戰場</button></div><div class="content"><section><div class="filters"><button id="heroesTab" class="active">武將組合</button><button id="lettersTab">單字庫</button></div><p id="collectionHint">點武將加入／移除自選，上限七名。</p><div id="collection" class="collection"></div></section><aside class="side"><h2>本場候選 · 共七將</h2><strong id="pickCount"></strong><div id="chosenNames" class="roster"></div><strong id="randomCount"></strong><div id="randomNames" class="roster"></div><button id="reroll">重新隨機補足</button><p class="hint">招募池：七將的組成字＋刀、槍、弓、投、塔。永久解鎖與養成尚未接入。</p><button id="apply" class="primary">套用候選並開新戰</button><p>會清空目前戰場與招募進度。單純切換分頁不會重開戰局。</p><div class="save-actions"><button id="exportCandidates">匯出候選</button><button id="importCandidates">匯入候選</button><input id="candidateFile" type="file" accept=".json,application/json" hidden></div><p class="hint">套用後自動保存候選陣容；匯入先預覽，按套用才開新戰。此檔不包含戰鬥進度或永久養成。</p><p id="notice" role="status"></p></aside></div><dialog id="confirm"><h2>套用候選並開新戰？</h2><p>目前部署、軍糧與局內進度將清空，使用新的七將候選重新開始。</p><button id="confirmApply" class="primary">確認開新戰</button> <button id="cancelApply">取消</button></dialog><script src="測試角色.js?v=20261103-machao1"></script><script src="武將戰鬥能力資料.js?v=20261108-import32"></script><script src="蜀國武將技能資料.js?v=20261108-shu-skills3"></script><script src="全武將補充技能資料.js"></script><script src="蜀國武將技能.js?v=20261108-shu-skills3"></script><script src="蜀國出戰池.js"></script><script src="武將戰鬥換算.js?v=20261108-shu-skills3"></script><script src="品質美術.js?v=20261108-four-name"></script><script src="候選存檔.js?v=20261103-save1"></script><script>
'use strict';const storySweep=new URLSearchParams(location.search).get('storySweep')==='1';const $=id=>document.getElementById(id),heroes=Object.keys(TestRoster).filter(n=>TestRoster[n].skills.length&&(!storySweep||ShuBattlePool.names.includes(n))),letters=Object.keys(TestRoster).filter(n=>TestRoster[n].letter);let chosen=[],draft=[],mode='heroes',dirty=false,hasBattle=false,cardLevels=[];
function fill(){const pool=heroes.filter(n=>!chosen.includes(n));for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}draft=[...chosen,...pool.slice(0,7-chosen.length)];}
function levelLabel(name){let saved='';try{const state=JSON.parse(localStorage.getItem('three-kingdoms-interface-preview-v1')||'{}'),m=storySweep?'story':state.mode||'battle',card=state.chests?.[m]?.letterProgress?.[name];if(card)saved='<small class="training-level">'+(m==='story'?'劇情':'對戰')+'養成 LV '+card.level+' · 經驗 '+(card.level>=100?'已滿級':card.xp+'／'+100*card.level)+'</small>';}catch{}const rows=cardLevels.filter(r=>r.type===name);if(!rows.length)return saved+'<small class="training-level empty">本場尚無此卡</small>';const grouped=new Map();for(const r of rows){const key=r.place+' · LV '+r.level+' · 經驗 '+(r.xp||0)+'／'+60*r.level;grouped.set(key,(grouped.get(key)||0)+1);}return saved+'<small class="training-level">'+[...grouped].map(([label,count])=>label+(count>1?' ×'+count:'')).join('<br>')+'</small>';}
function draw(){const list=mode==='heroes'?heroes:letters;$('collection').replaceChildren();for(const name of list){const b=document.createElement('button');b.className=chosen.includes(name)?'chosen':'';b.style.borderColor=QualityArt.colors(name).fill;b.innerHTML='<span class="name">'+name+'</span><small>'+(mode==='heroes'?TestRoster[name].skills.map(s=>s.name).join('／'):'可獨立出戰 · '+TestRoster[name].group)+'</small>'+(mode==='heroes'&&chosen.includes(name)?'<span class="pick">自選</span>':'')+levelLabel(name);b.disabled=storySweep||mode==='heroes'&&!chosen.includes(name)&&chosen.length===7;b.onclick=()=>{if(mode==='letters'){$('notice').textContent=name+' 可組成：'+heroes.filter(h=>h.includes(name)).join('、');return;}chosen=chosen.includes(name)?chosen.filter(n=>n!==name):[...chosen,name];dirty=true;fill();draw();};$('collection').append(b);}$('pickCount').textContent='自選 '+chosen.length+' 名';$('chosenNames').textContent=chosen.join('、')||'尚未自選';$('randomCount').textContent='系統補入 '+(7-chosen.length)+' 名';$('randomNames').textContent=draft.filter(n=>!chosen.includes(n)).join('、')||'已全部自選';$('reroll').disabled=storySweep||chosen.length===7;$('apply').disabled=storySweep;$('importCandidates').disabled=storySweep;$('heroesTab').classList.toggle('active',mode==='heroes');$('lettersTab').classList.toggle('active',mode==='letters');$('collectionHint').textContent=mode==='heroes'?(storySweep?'本場七將已確定；自選請回主城隊伍整備。補足武將僅供本場使用。':'點武將加入／移除自選，上限七名。'):'顯示本場字卡等級；場上與招募區分別列出。';}
$('heroesTab').onclick=()=>{mode='heroes';draw();};$('lettersTab').onclick=()=>{mode='letters';draw();};$('reroll').onclick=()=>{dirty=true;fill();draw();};$('back').onclick=()=>parent.postMessage({kind:'library-back'},'*');function apply(){parent.postMessage({kind:'library-apply',chosen,heroes:draft},'*');}$('apply').onclick=()=>{if(hasBattle)$('confirm').showModal();else apply();};$('confirmApply').onclick=()=>{$('confirm').close();apply();};$('cancelApply').onclick=()=>$('confirm').close();let battleSaveClosed=false;window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.kind==='battle-save-clear'){try{localStorage.removeItem('three-kingdoms-battle-v1');battleSaveClosed=true;parent.postMessage({kind:'battle-save-cleared',id:e.data.id,ok:true},'*');}catch{parent.postMessage({kind:'battle-save-cleared',id:e.data.id,ok:false},'*');}return;}if(e.data?.kind==='battle-save-write'&&battleSaveClosed)return;if(e.data?.kind==='battle-save-write'){try{localStorage.setItem('three-kingdoms-battle-v1',JSON.stringify(e.data.save));parent.postMessage({kind:'battle-save-written',id:e.data.id,ok:true},'*');}catch{parent.postMessage({kind:'battle-save-written',id:e.data.id,ok:false},'*');}return;}if(e.data?.kind==='library-state'){hasBattle=e.data.hasBattle;cardLevels=Array.isArray(e.data.cardLevels)?e.data.cardLevels.filter(r=>typeof r.type==='string'&&Number.isInteger(r.level)&&r.level>=1&&['場上','招募區'].includes(r.place)):[];if(!dirty){chosen=[...e.data.chosen];draft=[...e.data.heroes];}draw();}if(e.data?.kind==='library-applied'){dirty=false;$('notice').textContent=CandidateFiles.save(e.data.chosen,e.data.heroes)?'候選已套用並保存。':'候選已套用，但瀏覽器無法保存，請匯出備份。';}});function readBattleSave(){try{return JSON.parse(localStorage.getItem('three-kingdoms-battle-v1')||'null');}catch{return {invalid:true};}}parent.postMessage({kind:'library-ready',saved:CandidateFiles.read(),battleSaved:readBattleSave()},'*');

$('exportCandidates').onclick=()=>{const data=CandidateFiles.pack(chosen,draft);if(!CandidateFiles.valid(data))return;const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='三國候選陣容.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('notice').textContent='已匯出目前預覽的候選陣容。';};
$('importCandidates').onclick=()=>$('candidateFile').click();
$('candidateFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>65536)throw Error();const data=JSON.parse(await file.text());if(!CandidateFiles.valid(data))throw Error();chosen=[...data.chosen];draft=[...data.heroes];dirty=true;mode='heroes';draw();$('notice').textContent='已載入候選預覽；套用後才會保存並開新戰。';}catch{$('notice').textContent='無法匯入：請選擇有效的候選陣容檔，原陣容未更動。';}};
</script></body></html>
