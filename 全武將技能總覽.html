<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全武將技能總覽｜行旅手冊</title><style>*{box-sizing:border-box}body{margin:0;background:#f2eedf;color:#294236;font:17px/1.7 system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:clamp(26px,5vw,40px);margin:12px 0}p{margin:10px 0}.filters{display:flex;flex-wrap:wrap;gap:12px;position:sticky;top:0;background:#f2eedf;padding:14px 0;z-index:2}input,select{font:inherit;min-width:0;padding:10px;border:1px solid #a7b593;border-radius:7px;background:#fffdf5;color:inherit}input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}details{background:#fffdf5;border:1px solid #b6bea6;border-radius:10px;padding:14px;align-self:start}summary{cursor:pointer;font-weight:700}small{font-size:13px;color:#607361}article{border-top:1px solid #d9decc;padding:12px 0}h3{margin:0;font-size:18px}.count{margin-bottom:18px}a{color:#2d6754}</style></head><body><script src="行旅手冊導覽.js"></script><main><small>字卡武將篇 · 實裝技能</small><h1>全武將技能總覽</h1><p>目前字卡庫 254 名武將，各有兩項實裝技能。點名稱查看射程、倍率、冷卻與觸發條件。技能是遊戲設計，不是史實能力評分。</p><p>既有技能沿用；補充武將依角色定位設計，部分同類武將共用招式。技能倍率以物攻、謀攻或輔助力計算；養成提升能力，不直接縮短冷卻。劇情敵將另有各關設定。</p><div class="filters"><input id="search" aria-label="搜尋武將、技能或效果" placeholder="搜尋武將、技能或效果"><select id="faction" aria-label="陣營"><option value="">全部陣營</option><option>蜀</option><option>魏</option><option>吳</option><option>群雄</option><option>東漢</option></select></div><div id="count" class="count" aria-live="polite"></div><div id="list" class="grid"></div></main><script src="人物評定草案.js"></script><script src="武將品質草案.js"></script><script src="測試角色.js"></script><script src="武將戰鬥能力資料.js"></script><script src="蜀國武將技能資料.js"></script><script src="全武將補充技能資料.js"></script><script src="蜀國武將技能.js"></script><script src="武將戰鬥換算.js"></script><script>
const search=document.getElementById('search'),faction=document.getElementById('faction'),list=document.getElementById('list');function render(){list.replaceChildren();const q=search.value.trim();let count=0;for(const p of OFFICER_PROPOSAL.entries){if(p.holdingOnly)continue;const r=TestRoster[p.name];if(faction.value&&p.faction!==faction.value||q&&![p.name,...(p.aliases||[]),p.role,...r.skills.flatMap(s=>[s.name,s.desc])].join(' ').includes(q))continue;count++;const card=document.createElement('details'),title=document.createElement('summary');title.textContent=p.name+' · '+p.faction+' · '+r.quality;card.append(title);const note=document.createElement('p');note.textContent=p.role+'｜'+(r.weaponLabel||({magic:'術法',arrow:'弓',pierce:'槍',hit:'近戰',stone:'拋石'}[r.kind]))+'｜普攻 '+r.range+' 格';card.append(note);for(const s of r.skills){const a=document.createElement('article'),h=document.createElement('h3'),text=document.createElement('p');h.textContent=s.name+' · '+(s.cd?'冷卻 '+s.cd+' 秒':'被動');text.textContent=s.desc;a.append(h,text);card.append(a);}list.append(card);}document.getElementById('count').textContent='顯示 '+count+' / '+OFFICER_PROPOSAL.entries.length+' 名武將';}search.oninput=render;faction.onchange=render;render();
</script></body></html>
