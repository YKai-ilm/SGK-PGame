<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>天下輿圖｜行旅手冊</title><link rel="stylesheet" href="三國大地圖預覽.css"></head><body class="game-map handbook-map"><style>.handbook-map{height:auto;min-height:100dvh}.handbook-map .studio{height:auto}.handbook-map .phone{height:auto;min-height:0}.handbook-map .map-shell{height:65dvh;min-height:320px}.handbook-map .phone-top,.handbook-map .home-indicator{display:none}</style>
<main class="studio">
<section class="phone" aria-label="手機大地圖預覽"><div class="phone-top"><span>9:41</span><span>● ▰ ▰</span></div><header><div class="seal">圖</div><div><small>行旅手冊 · 大地圖</small><h2>天下輿圖</h2></div><button id="placesButton" class="preview-badge">地點 80</button></header>
<div class="map-shell"><div id="viewport" tabindex="0" aria-label="可拖曳大地圖；方向鍵平移，加減鍵縮放"><div id="world"><img id="terrain" data-src="三國大地圖-候選-v1.webp" alt="沿用首版山河城池原圖；字卡對準既有建築" draggable="false"><svg id="routes" viewBox="0 0 1536 1024" aria-hidden="true"><path id="journey" d="M1198 102 L1006 410 L922 174 L799 389 L722 492"/></svg><div id="markers"></div></div></div>
<div class="map-caption"><span class="live-dot"></span><span id="nodeCount">全國地點</span></div><div class="compass" aria-hidden="true"><span>北</span>✦</div>
<div class="map-tools"><button id="zoomIn" aria-label="放大">＋</button><span id="zoomValue">100%</span><button id="zoomOut" aria-label="縮小">−</button><button id="fit" aria-label="全圖總覽">全圖</button></div>
<div class="map-bottom"><button hidden id="routeToggle" aria-pressed="true">行軍路線</button><button id="viewToggle" aria-pressed="false">展開已配置地點</button><button id="locate">◎ 下曲陽定位</button></div><div id="hint">點原圖城池或字卡 · 可展開更多地點</div></div>
<section class="location" aria-live="polite"><div class="location-heading"><div><p id="locationStatus">目前位置</p><h3 id="locationName">宛城</h3></div><span id="locationNumber">03</span></div><p id="locationDescription"></p><div class="location-footer"><span id="chapterName"></span><button id="chapterButton">查看地點 <span>↗</span></button></div></section>
<div class="home-indicator"></div>
<dialog id="placeDialog"><button id="closePlaces" aria-label="關閉地點清單">×</button><h2>天下地點</h2><p>搜尋地點後可在圖上定位。這裡僅供查看，不會移動遊戲角色。</p><label>搜尋地名<input id="placeSearch" type="search" placeholder="例如：新野"></label><label>類別<select id="placeType"><option value="">全部地點</option><option>城池</option><option>關隘</option><option>戰場</option><option>區域</option><option>村莊</option><option>據點</option><option>山地</option><option>水域</option></select></label><p id="searchCount" aria-live="polite"></p><div id="placeResults"></div></dialog><dialog id="chapterDialog"><button id="closeDialog" aria-label="關閉行程">×</button><p class="eyebrow">前往資訊</p><h2 id="dialogTitle"></h2><p id="dialogText"></p><ol id="dialogSteps"></ol><button id="travelNow" hidden>沿道路前往</button><p id="travelError" role="status"></p><p class="dialog-note">免費步行每段30秒，所有地點不受劇情鎖定，只能走相鄰道路；驛站與任務入口立即抵達。</p></dialog></section></main><script>window.HANDBOOK_MAP=true;</script><script src="三國大地圖預覽.js"></script><script src="行旅手冊導覽.js"></script></body></html>
