<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>驛路棋盤編輯器</title><link rel="stylesheet" href="驛路棋盤編輯器.css"></head><body>
<header><div><small>行旅手冊 · 排版工具</small><h1>驛路棋盤編輯器</h1></div><a href="驛站票價圖.html">返回收費圖表</a></header>
<div class="toolbar"><button data-mode="move" class="active">選取／移動</button><button data-mode="node">放圓點</button><button data-mode="edge">拉線</button><button id="cancel">取消拉線</button><button id="undo">復原</button><button id="export">匯出配置</button><button id="import">匯入配置</button><input type="file" id="file" accept=".json,application/json" hidden><button id="reset">還原示例</button></div>
<p id="hint" role="status">拖動圓點可吸附到交點；選取圓點後可調整名稱與文字位置。</p>
<main><aside>
<section><h2>棋盤</h2><p>30 × 30 格，31 × 31 個交點。只編輯示意排版，不更動遊戲道路或票價。</p><label>顯示大小 <input id="zoom" type="range" min="40" max="150" value="75"><output id="zoom-value">75%</output></label><button id="fit">全圖</button><label><input id="grid" type="checkbox" checked>顯示格線</label></section>
<section id="node-panel" hidden><h2>圓點與文字框</h2><label>城鎮名稱<input id="name" maxlength="24"></label><label>文字大小<input id="font" type="number" min="10" max="32" value="18"></label><label>文字離圓點幾格<input id="distance" type="number" min="0.5" max="3" step="0.5" value="1"></label><div class="directions" aria-label="文字框八方向"><button data-dir="nw">↖</button><button data-dir="n">↑</button><button data-dir="ne">↗</button><button data-dir="w">←</button><span>●</span><button data-dir="e">→</button><button data-dir="sw">↙</button><button data-dir="s">↓</button><button data-dir="se">↘</button></div><label><input type="checkbox" id="label-box">顯示文字外框</label><button id="bend-node">改為轉角（不留圓點與名稱）</button><p>適用於接著兩條線的地點，轉換後保留線路彎折。</p><button id="delete-node" class="danger">刪除此圓點及連線</button></section>
<section><h2 id="edge-title">新連線樣式</h2><label>線條<select id="line-type"><option value="1">單線</option><option value="2">並排雙線</option></select></label><div class="colors"><label>第一條<input id="color" type="color" value="#845ba5"></label><label>第二條<input id="color2" type="color" value="#82959a"></label></div><label>雙線間距<input id="gap" type="number" min="6" max="20" value="10"></label><button id="delete-edge" class="danger" hidden>刪除此連線</button><p>拉線模式：先點起點，空白交點可加無圓點轉角，最後點終點。直接點兩個圓點即可畫直線。選取既有線可改為雙線。</p></section>
<section><h2>配置保存</h2><p>修改會自動暫存於這個瀏覽器。完成後請「匯出配置」，把 JSON 檔傳給我套用。匯入、還原及刪除都可以復原。</p><p id="save-state" aria-live="polite"></p></section>
</aside><div class="board-wrap" id="viewport"><svg id="board" viewBox="0 0 1360 1360" role="img" aria-label="30乘30格驛路編輯棋盤"></svg></div></main>
<script src="驛路棋盤編輯器.js"></script></body></html>
