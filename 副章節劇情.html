<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>副章節劇情｜行旅手冊</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e3;color:#294236;font:17px/1.85 system-ui,'Microsoft JhengHei',sans-serif}main{max-width:1040px;margin:auto;padding:24px}section{background:#fffcf2;border:1px solid #c6ceb7;border-radius:12px;padding:22px;margin:20px 0}a{color:#286654}nav{display:flex;gap:12px;flex-wrap:wrap}nav a{padding:6px 10px;border:1px solid #acb99a;border-radius:6px}nav a[aria-current=page]{background:#2e5845;color:white}.note{padding:14px;background:#e7ecd9;border-left:4px solid #87966e}h1{font-size:30px}h2{font-size:23px}h3{font-size:19px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #ced5c0;text-align:left;vertical-align:top}th{width:105px}blockquote{margin:12px 0;padding:10px 18px;background:#eef1e2;border-left:3px solid #a8b794}small{color:#64715d}@media(max-width:600px){main{padding:12px}section{padding:15px}h1{font-size:25px}th{width:80px}th,td{padding:8px}}@media print{nav{display:none}body{background:white}section{border:0;padding:0}}</style><script src="糜家劇情.js"></script><script src="背景音樂.js" data-scene="story"></script></head><body><main><a id="back" href="蜀陣營主線架構.html">← 主章節與副章節目錄</a><h1 id="title"></h1><p id="status" class="note"></p><nav id="siblings" aria-label="本章副章節"></nav><section><h2>場所與人物</h2><p id="people"></p></section><section><h2>劇情順序</h2><div id="steps"></div></section><section id="dialogueSection"><h2>新增銜接對話草案</h2><p>以下為供討論的新台詞；未覆蓋正式遊戲台詞。</p><div id="dialogue"></div></section><section><h2>獎勵與解鎖</h2><div id="rewards"></div><p>完成對應事件才取得獎勵，離村或進入下一章不代表完成本章。</p></section><section><h2>與現有內容的對照</h2><table><tbody id="changes"></tbody></table></section><p><small>本頁為劇情規劃與現況對照，不會修改遊戲存檔。新增場景、關卡與流程尚須另行實裝。</small></p></main><script src="副章節劇情資料.js"></script><script>
(()=>{const id=new URLSearchParams(location.search).get('id')||'1-1',d=StorySubchapters.find(x=>x.id===id),$=id=>document.getElementById(id);if(!d){$('title').textContent='找不到這個副章節';$('status').textContent='請返回主章節目錄選擇。';return;}document.title=d.id+' '+d.name+'｜行旅手冊';$('title').textContent=d.id+'．'+d.name+'｜'+d.chapter;$('status').textContent=d.status;$('back').href='蜀陣營主線架構.html#'+d.back;$('people').textContent=d.people;for(const x of StorySubchapters.filter(x=>x.chapter===d.chapter)){const a=document.createElement('a');a.href='副章節劇情.html?id='+x.id;a.textContent=x.id+' '+x.name;if(x.id===id)a.setAttribute('aria-current','page');$('siblings').append(a);}for(const [i,[title,text]]of d.steps.entries()){const h=document.createElement('h3'),p=document.createElement('p');h.textContent=(i+1)+'. '+title;p.textContent=text;$('steps').append(h,p);}if(d.dialogueTitle)$('dialogueSection').querySelector('h2').textContent=d.dialogueTitle;if(d.dialogueNote)$('dialogueSection').querySelector('p').textContent=d.dialogueNote;if(!d.dialogue)$('dialogueSection').hidden=true;for(const [who,line]of d.dialogue||[]){const q=document.createElement('blockquote');q.textContent=who+'：「'+line+'」';$('dialogue').append(q);}for(const text of d.rewards||[]){const p=document.createElement('p');p.textContent=text;document.getElementById('rewards').append(p);}for(const [label,text]of d.changes){const tr=document.createElement('tr'),th=document.createElement('th'),td=document.createElement('td');th.textContent=label;th.scope='row';td.textContent=text;tr.append(th,td);$('changes').append(tr);}})();
</script><script src="行旅手冊導覽.js"></script></body></html>
