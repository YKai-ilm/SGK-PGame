<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三哥吞食 · 更新</title><style>body{background:#f4f0e3;color:#294234;font-family:system-ui;padding:30px;line-height:1.8}button,a{font:inherit;padding:10px}</style></head><body><h1>三哥吞食</h1><p id="status" role="status">正在準備新版，完成後返回手機模擬器。存檔會保留。</p><button id="retry" hidden>重試</button><script>
const status=document.getElementById('status'),retry=document.getElementById('retry');let done=false;
function finish(){if(done)return;done=true;location.replace('手機模擬.html');}
async function update(){retry.hidden=true;try{if(!('serviceWorker'in navigator)){finish();return;}const registration=await navigator.serviceWorker.register('sw.js',{scope:'./',updateViaCache:'none'});await registration.update();const activate=worker=>{if(worker?.state==='installed')worker.postMessage('ACTIVATE');};if(registration.waiting)activate(registration.waiting);else if(registration.installing){const worker=registration.installing;worker.addEventListener('statechange',()=>{activate(worker);if(worker.state==='redundant'){status.textContent='更新下載未完成，請保持連線後重試。';retry.hidden=false;}});activate(worker);}else finish();}catch{status.textContent='暫時無法下載更新，請確認連線後重試。';retry.hidden=false;}}
navigator.serviceWorker?.addEventListener('controllerchange',finish);retry.onclick=update;update();
</script></body></html>
