<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone 15 Pro Max｜手機外框預覽</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 55%,#25302b,#101714 75%);color:#e7e7d4;font-family:system-ui,'Microsoft JhengHei',sans-serif;min-height:100vh}header{padding:25px 28px 10px;text-align:center}h1{font-size:21px;margin:0 0 8px;font-weight:600}p{font-size:12px;color:#aab5a2;line-height:1.6;margin:8px 0}.toolbar{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0 8px}button,select{font:inherit;font-size:13px;color:#dce2d2;background:#25382c;border:1px solid #56624c;padding:9px 17px;min-height:40px;border-radius:7px;cursor:pointer}button.active{background:#a28a55;color:#141e18;border-color:#d6bd81}.detail{font-size:11px;color:#a8b39f}#area{width:max-content;min-width:100%;display:flex;align-items:center;justify-content:center;padding:28px 20px 40px;min-height:calc(100dvh - 180px)}#shell{position:relative;flex-shrink:0;border:3px solid #787b70;border-radius:40px;background:#050706;box-shadow:0 0 0 2px #1d211d,0 25px 70px #0009;transition:width .2s,height .2s}#screen{position:absolute;overflow:hidden;isolation:isolate;border-radius:27px;background:#101b18}iframe{border:0;display:block;transform-origin:top left}#island{position:absolute;background:#020302;border:1px solid #232823;z-index:2;pointer-events:none;border-radius:16px}#camera{position:absolute;background:#172336;border:2px solid #0d131a;width:7px;height:7px;border-radius:50%;top:5px;left:5px}#home{position:absolute;background:#aeb6a6;opacity:.7;border-radius:5px;pointer-events:none;height:3px;width:18%;left:41%;bottom:5px}#shell:before,#shell:after{content:'';position:absolute;background:#787b70;border-radius:2px}#shell:before{width:3px;height:40px;left:-5px;top:65px}#shell:after{height:3px;width:55px;top:-5px;right:85px}.portrait #shell:after{width:3px;height:55px;right:-5px;top:120px}footer{text-align:center;font-size:11px;color:#8d9b88;padding:0 16px 18px}@media(max-width:600px){header{padding:15px 12px 0}h1{font-size:17px}#area{padding:20px 10px;min-height:calc(100dvh - 210px)}}
body>header{padding:8px 12px}body>header h1,body>header p,body>header .detail,body>footer{display:none}.toolbar{margin:0;gap:6px}.toolbar button,.toolbar select{min-height:32px;padding:5px 12px}#area{padding:6px 12px 12px;min-height:0;align-items:flex-start}@media(max-width:600px){body>header{padding:6px}#area{padding:4px 6px 8px}.toolbar{gap:4px}.toolbar button,.toolbar select{font-size:11px;padding:4px 7px}}#scaleStatus{font-size:11px;color:#aab5a2;white-space:nowrap}#area{width:100%;min-width:0}
body{height:100dvh;min-height:0;display:grid;grid-template-columns:152px minmax(0,1fr);overflow:hidden}
body>header{padding:12px 8px;min-height:0;overflow-y:auto;border-right:1px solid #44513d;background:#101914b3}
.toolbar{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin:0}
.toolbar button,.toolbar select{width:100%;min-width:0;min-height:40px;padding:8px;font-size:14px}
#scaleStatus{text-align:center;white-space:normal;line-height:1.5}
#area{height:100%;width:100%;min-width:0;min-height:0;padding:4px;align-items:center;justify-content:center;overflow:hidden}
#shell{transition:none;box-shadow:0 0 0 1px #1d211d,0 12px 28px #0006}
@media(max-width:600px){body{grid-template-columns:104px minmax(0,1fr)}body>header{padding:8px 5px}.toolbar{gap:8px}.toolbar button,.toolbar select{padding:6px 3px;font-size:12px;min-height:38px}#area{padding:4px}}
#statusBar[hidden],#browserBar[hidden]{display:none!important}#game{position:absolute}#screen{background:#f4f0e3}#statusBar{position:absolute;display:flex;justify-content:space-between;align-items:center;color:#171d18;pointer-events:none;font-weight:600}#browserBar{position:absolute;color:#263e33;text-align:center;background:#e8e4d8;line-height:2;pointer-events:none}.device-label{font-size:14px;text-align:center;line-height:1.6}</style><link rel="stylesheet" href="遊戲字體.css?v=20261107-1"></head><body><header><h1>iPhone 15 Pro Max</h1><p>手機外框預覽 · 內容可直接操作</p><div class="toolbar"><button id="landscape" class="active" aria-pressed="true">橫版</button><button id="portrait" aria-pressed="false">直版</button><span class="device-label">iPhone 15 Pro Max</span><select id="displayMode" aria-label="手機顯示模式"><option value="standalone">加入主畫面</option><option value="safari">Safari（工具列展開示意）</option></select><select id="previewPage" aria-label="預覽內容"><option value="ui">主介面流程</option><option value="battle">原有戰場</option><option value="story">桃園起兵劇情</option></select><button id="reloadGame" title="重新載入最新檔案，可選擇載入已保存戰鬥">重新載入</button><select id="zoom" aria-label="預覽縮放"><option value="auto">自動適合視窗</option><option value="0.65">縮放 65%</option><option value="0.8">縮放 80%</option><option value="1">原尺寸 100%</option></select><span id="scaleStatus" aria-live="polite"></span></div><div id="detail" class="detail"></div></header><div id="area"><div id="shell"><div id="screen"><div id="statusBar"><span>9:41</span><span>▮▮▮ Wi-Fi ▰</span></div><iframe id="game" title="手機內的遊戲預覽" src="index.html" allow="autoplay"></iframe><div id="browserBar">sgk-pgame.pages.dev<br>‹　　›　　分享　　分頁</div></div><div id="island"><i id="camera"></i></div><div id="home"></div></div></div><footer>字卡庫／戰場分頁 · 20261102-screen2<br>橫版：中央戰場＋側邊招募　｜　直版：原先的上下排列<br>切換方向可載入已保存戰鬥；外框為示意，非 Apple 原生模擬器。</footer><script>
const shell=document.getElementById('shell'),screenBox=document.getElementById('screen'),game=document.getElementById('game'),island=document.getElementById('island'),zoom=document.getElementById('zoom');let orientation='portrait';
function previewSource(direction){return document.getElementById('previewPage').value==='story'?'桃園起兵.html':document.getElementById('previewPage').value==='ui'?'主介面流程預覽.html':direction==='landscape'?'戰場預覽.html':'戰場直版.html';}
function loadPreview(){game.src='index.html#page='+encodeURIComponent(previewSource(orientation)+'?v='+Date.now());}
document.getElementById('previewPage').onchange=()=>{loadPreview();fit();};document.getElementById('displayMode').onchange=fit;
function fit(){
 const horizontal=orientation==='landscape',safari=document.getElementById('displayMode').value==='safari';
 const w=horizontal?932:430,h=horizontal?430:932;
 // 模擬常見的預設顯示；Safari 工具列會隨 iOS 版本與收合狀態改變。
 const safe=horizontal?{top:0,bottom:safari?78:21,left:59,right:59}:{top:59,bottom:safari?134:34,left:0,right:0};
 const viewW=w-safe.left-safe.right,viewH=h-safe.top-safe.bottom;
 const bezel={x:12,y:12},area=document.getElementById('area'),limit=Math.max(.01,Math.min((area.clientWidth-14)/(w+bezel.x*2),(area.clientHeight-14)/(h+bezel.y*2))),scale=zoom.value==='auto'?limit:Math.min(Number(zoom.value),limit);
 shell.style.width=(w+bezel.x*2)*scale+6+'px';shell.style.height=(h+bezel.y*2)*scale+6+'px';screenBox.style.left=bezel.x*scale+'px';screenBox.style.top=bezel.y*scale+'px';screenBox.style.width=w*scale+'px';screenBox.style.height=h*scale+'px';shell.style.borderRadius=52*scale+'px';screenBox.style.borderRadius=40*scale+'px';screenBox.style.clipPath='inset(0 round '+40*scale+'px)';
 game.style.left=safe.left*scale+'px';game.style.top=safe.top*scale+'px';game.style.width=viewW+'px';game.style.height=viewH+'px';game.style.transform='scale('+scale+')';
 const status=document.getElementById('statusBar');status.hidden=horizontal;status.style.cssText='left:'+28*scale+'px;top:0;width:'+(w-56)*scale+'px;height:'+safe.top*scale+'px;font-size:'+14*scale+'px';
 const bar=document.getElementById('browserBar');bar.hidden=!safari;bar.style.cssText='left:0;bottom:'+ (horizontal?21:34)*scale+'px;width:'+w*scale+'px;height:'+(safe.bottom-(horizontal?21:34))*scale+'px;font-size:'+14*scale+'px';
 island.style.width=(horizontal?37:126)*scale+'px';island.style.height=(horizontal?126:37)*scale+'px';island.style.left=(bezel.x+(horizontal?11:(w-126)/2))*scale+'px';island.style.top=(bezel.y+(horizontal?(h-126)/2:11))*scale+'px';
 const home=document.getElementById('home');home.style.width=134*scale+'px';home.style.height=5*scale+'px';home.style.left=(bezel.x+(w-134)/2)*scale+'px';home.style.bottom=(bezel.y+8)*scale+'px';home.style.background='#263e33';
 document.getElementById('scaleStatus').textContent='畫面 '+w+' × '+h+'\n遊戲 '+viewW+' × '+viewH+'\n預覽縮放 '+Math.round(scale*100)+'%';document.getElementById('scaleStatus').style.whiteSpace='pre-line';
 document.getElementById('detail').textContent='iPhone 15 Pro Max · '+(safari?'Safari 工具列展開示意':'加入主畫面：上方 59／底部 34（直向）');
}
function change(value){orientation=value;document.body.classList.toggle('portrait',value==='portrait');for(const name of ['landscape','portrait']){const b=document.getElementById(name);b.classList.toggle('active',name===value);b.setAttribute('aria-pressed',String(name===value));}fit();}document.getElementById('landscape').onclick=()=>change('landscape');document.getElementById('portrait').onclick=()=>change('portrait');document.getElementById('reloadGame').onclick=()=>{loadPreview();};zoom.onchange=fit;addEventListener('resize',fit);const initialPage=new URLSearchParams(location.search).get('page');if(['ui','battle','story'].includes(initialPage)){document.getElementById('previewPage').value=initialPage;loadPreview();}change('portrait');
</script></body></html>
