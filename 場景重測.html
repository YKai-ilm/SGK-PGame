<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>場景重測｜三國行旅手冊</title><link rel="stylesheet" href="遊戲字體.css"><style>body{margin:0;background:#f8f4e8;color:#294236;font-family:serif}main{max-width:780px;margin:auto;padding:24px}a{color:inherit}p{line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}article{border:1px solid #b4baa2;border-radius:12px;padding:18px}button{font:inherit;padding:12px;border:1px solid #8b695a;border-radius:8px;background:#724b3a;color:#fff8e8;cursor:pointer}</style></head><body><main><a href="行旅手冊.html#scenes">‹ 返回行旅手冊・場景篇</a><h1>互動劇情・場景重測</h1><p>統一使用獨立測試進度。對話、寶箱、行囊、戰鬥與取得的獎勵只影響這次測試，正式遊戲存檔不會更動。測試中按「恢復初始值」即可從所選入口重新開始，按「退出測試」回到這裡。</p><div class="grid"><article><h2>桃園起兵</h2><p>從劉備家開始，測試村中對話、村東拾取、村西水井與支線。</p><button data-scene="taoyuan">從初始狀態測試</button></article><article><h2>徐州城</h2><p>從首次進城開始，測試內城、城西及各室內互動。測試預設劉關張已結義。</p><button data-scene="xuzhou">從初始狀態測試</button></article><article><h2>雲龍山</h2><p>寶箱、行囊與花叢未領取，盜賊及救援事件未完成。備妥救援所需藥膏，方便連續測試。</p><button data-scene="yunlong">從初始狀態測試</button></article></div><p>純美術預覽仍由場景圖鑑查看，不會產生劇情進度。測試進度隨目前瀏覽分頁保存；請在測試結束後按「退出測試」。</p></main><script>document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>SceneTest.start(b.dataset.scene));</script></body></html>
