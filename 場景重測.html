<!doctype html><html lang="zh-Hant"><head><script src="場景測試設定.js"></script><script src="場景重測.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>場景劇情測試／電子攻略</title><link rel="stylesheet" href="遊戲字體.css"><style>body{margin:0;background:#f8f4e8;color:#294236;font-family:serif}main{max-width:950px;margin:auto;padding:20px}a{color:inherit}p{line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}button{font:inherit;padding:18px;border:1px solid #a69a7b;border-radius:8px;background:#fffaf0;color:#294236;cursor:pointer}</style></head><body><main><a href="劇情場景圖鑑.html">‹ 返回場景圖鑑</a>　<a href="行旅手冊.html#scenes">行旅手冊</a><h1>場景劇情測試／電子攻略</h1><p>選擇一張場景圖，點人物或事件卡測試實際劇情。出口只顯示去向，不跳到遊戲。上方可恢復初始、選擇已取得道具及事件階段，查看不同對話。</p><p>這裡使用獨立測試資料，所有獎勵及進度不會帶入正式遊戲。人物卡依實際事件條件顯示；尚未出現的人物，可從事件條件選擇對應階段。</p><div id="scenes"></div></main><script>if(new URLSearchParams(location.search).get('back')==='guide')location.replace('劇情場景圖鑑.html');else{const id=new URLSearchParams(location.search).get('scene');if(id&&SceneTest.routes[id])SceneTest.start(id);else for(const group of [...new Set(Object.values(SceneTest.routes).map(r=>r.group))]){const h=document.createElement('h2');h.textContent=group;const grid=document.createElement('div');grid.className='grid';for(const [id,r]of Object.entries(SceneTest.routes)){if(r.group!==group)continue;const b=document.createElement('button');b.dataset.scene=id;b.textContent=r.name;b.onclick=()=>SceneTest.start(id);grid.append(b);}document.getElementById('scenes').append(h,grid);}}</script></body></html>
