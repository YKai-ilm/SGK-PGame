<div class="notice">主表顯示本遊戲的百分制能力設定，一般上限99；已確認及匯入的能力已接入戰鬥，瀏覽器內新修改仍須匯出同步。參考值、評定理由及來源可點人物查看；吞食天地原始值完整保留於詳情。武將品質先判特殊高分條件，再按平均分計算，戰鬥屬性依六維換算。</div>
<div class="bar"><a href="全武將能力複核.html">全武將複核紀錄</a><button id="people" class="active">人物能力</button><button id="letters">共用單字庫</button><button id="compare">能力比較</button><button id="quality">武將品質</button><button id="rules">評定規則與來源</button><button id="exportBase">匯出原始值</button><button id="exportDraft">匯出設計草稿</button><button id="importDraft">載入設計草稿</button><input id="file" type="file" accept=".json" hidden></div>
<div class="bar"><input id="search" placeholder="搜尋姓名、單字或編號" aria-label="搜尋"><select id="faction" aria-label="陣營"><option value="">全部陣營</option><option>魏</option><option>蜀</option><option>吳</option><option>群雄</option><option>東漢</option><option>待分類</option></select><select id="progress" aria-label="評定進度"><option value="rated">已有評定</option><option value="all">全部人物</option><option value="pending">尚待評定</option><option value="identity">身分待核</option></select><select id="batch" aria-label="評定批次"><option value="">全部批次</option></select><select id="sort" aria-label="排序"><option value="name">依姓名</option><option value="str">武力高到低</option><option value="int">智力高到低</option><option value="lead">統率高到低</option><option value="body">體魄高到低</option><option value="agi">敏捷高到低</option><option value="charm">魅力高到低</option></select></div>
<div id="qualityTools" class="bar" hidden><select id="qualityProgress" aria-label="品質評定進度"><option value="rated">可計算品質</option><option value="pending">能力不完整</option><option value="all">全部人物</option></select><select id="qualityTier" aria-label="品質顏色"><option value="">全部品質</option><option>青</option><option>綠</option><option>藍</option><option>橘</option><option>紅</option><option>紫</option><option>金</option></select><select id="qualityRebirth" aria-label="轉生試算"><option value="0">未轉生（基本品質）</option><option value="1">一轉以上（金色試算）</option></select><button id="exportQuality">匯出品質計算</button></div><div id="compareTools" class="bar" hidden><label><input id="compareUnverified" type="checkbox">包含身分待核人物</label><span class="muted">統計依上方篩選；下方並排比較可跨陣營挑選。</span></div><div id="letterTools" class="bar" hidden><label><input id="includeUnverified" type="checkbox">包含身分待核人物</label><select id="letterSort" aria-label="單字排序"><option value="name">依單字排序</option><option value="shared">共用武將多到少</option></select><button id="exportLetters">匯出完整單字關聯</button><span class="muted">匯出依待核勾選，不受搜尋、陣營或批次篩選影響。</span></div><div id="status" role="status"></div><div id="stats" class="stats"></div><div id="content"></div>
