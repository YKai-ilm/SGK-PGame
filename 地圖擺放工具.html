<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戰場地圖擺放桌</title><link rel="stylesheet" href="遊戲字體.css"><style>
*{box-sizing:border-box}body{margin:0;background:#eae6d8;color:#293f32;font-family:DFKai-SB,serif}main{display:grid;grid-template-columns:250px 1fr;height:100dvh}aside{padding:20px 16px;overflow:auto;background:#f7f2e4;border-right:1px solid #b8bea5}h1{font-size:24px;margin:0 0 8px}p{font-size:14px;line-height:1.6}button,select,input{font:inherit;color:inherit;padding:9px;border:1px solid #aeb99c;background:#faf7ed;border-radius:6px;min-height:40px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.active{background:#d5dfbf;outline:2px solid #637d50}label{display:block;margin:12px 0 7px}select{width:100%}.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tools button{padding:4px}.tools canvas{display:block;width:72px;height:72px;margin:auto;border-radius:4px}.row{display:flex;gap:6px;margin:10px 0}.row>*{flex:1;min-width:0}section{overflow:auto;padding:18px;display:flex;flex-direction:column;align-items:center}#board{display:block;width:min(100%,660px);height:auto;touch-action:none;box-shadow:0 4px 18px #24352333;border-radius:6px;background:#7f9950}#status{max-width:660px;width:100%;margin:0 0 12px;line-height:1.5}small{display:block;color:#6b785f;margin:7px 0;line-height:1.5}input[type=checkbox]{min-height:0}#notice{color:#786341}button:focus-visible{outline:3px solid #b28e38}@media(max-width:700px){main{height:auto;display:block}aside{border:0;padding:12px}.tools{grid-template-columns:repeat(7,1fr);gap:5px}.tools canvas{width:36px;height:36px}.tools button{font-size:12px}aside>p{margin:5px 0}section{padding:10px}h1{font-size:20px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px}.settings label{margin:0}#board{width:100%}}</style></head><body><main><aside><h1>戰場地圖擺放桌</h1><p>選元件後點格子放置。按住可連續鋪設；也可以直接把元件拖進地圖。</p><div class="tools" id="tools"></div><div class="settings"><label>地圖大小<select id="size"><option value="6x10">一般直版 · 6 × 10</option><option value="6x15">關卡直版 · 6 × 15</option><option value="10x6">一般橫版 · 10 × 6</option><option value="10x12">關卡橫版 · 10 × 12</option></select></label><label>起始路線<select id="route"><option value="step1">階梯一</option><option value="step2">階梯二</option><option value="step3">階梯三</option><option value="step4">階梯四</option></select></label></div><div class="row"><button id="template">載入範例</button><button id="clear">清空地圖</button></div><div class="row"><button id="undo">復原</button><button id="redo">重做</button></div><label><input id="grid" type="checkbox" checked> 顯示格線與座標</label><label>配置名稱<input id="name" value="我的戰場" style="width:100%" maxlength="60"></label><div class="row"><button id="save">匯出配置</button><button id="image">匯出圖片</button></div><button id="import" style="width:100%">匯入配置</button><input id="file" type="file" accept=".json,application/json" hidden><small>道路自動銜接相鄰道路。森林、岩盤可蓋在道路上；擦除先移除最上層。營帳、城池各一座。</small><small>「移動」可拖動場上的元件。配置自動留在此瀏覽器，不影響遊戲存檔。</small><small>擺好後匯出配置給我，就能照你的安排整合進遊戲。</small><small id="notice" role="status"></small></aside><section><p id="status">正在準備地圖…</p><canvas id="board" aria-label="可編輯戰場地圖"></canvas></section></main><script src="自然地表.js?v=editor1"></script><script src="障礙地形.js?v=20261109-maps-items-safe"></script><script src="地形美術.js?v=editor1"></script><script src="戰場配置資料.js?v=20261109-maps"></script><script src="戰場路線.js?v=20261109-maps-items-safe"></script><script src="地圖擺放工具.js?v=20261109-maps-items-safe"></script><script src="行旅手冊導覽.js"></script></body></html>
