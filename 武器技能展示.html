<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>武器與技能展示</title><link rel="stylesheet" href="遊戲字體.css"><style>
*{box-sizing:border-box}body{margin:0;background:#efecdf;color:#294335;font:16px system-ui}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 10px}p{line-height:1.7}header p{color:#69745c;margin:6px 0 20px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}.stage,aside{background:#faf7eb;border:1px solid #bdc6aa;border-radius:16px;padding:16px}canvas{display:block;width:100%;max-height:75vh;object-fit:contain;pointer-events:none;border-radius:10px}button,select,input{font:inherit;border:1px solid #b4bea2;border-radius:7px;background:#fffcf1;color:#294335;padding:10px;min-height:44px}select,input{width:100%;margin:6px 0 14px}button{cursor:pointer}button.active{background:#31573f;color:#fff8df}label{display:block;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.skill-buttons{display:grid;gap:8px}.skill-buttons button{text-align:left}#description{font-size:14px;line-height:1.9;border-top:1px solid #ccd1bd;padding-top:14px}#summary{font-size:14px;color:#69745c}.note{font-size:13px;color:#768069}#live{font-size:14px;min-height:24px}a{color:#31573f}@media(max-width:850px){main{padding:12px}.layout{grid-template-columns:1fr}aside{grid-row:1}canvas{max-height:65vh}.skill-buttons{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><header><h1>武器與技能展示</h1><p>選武將，直接觀看目前遊戲的揮舞與技能效果。</p></header><div class="layout"><section class="stage"><canvas id="board" width="720" height="720"></canvas><div class="actions"><button id="toggle">暫停</button><button id="replay">重新播放</button><button id="step">逐格前進</button><label>速度<select id="previewSpeed"><option value="0.25">¼ 倍慢動作</option><option value="0.5">½ 倍</option><option value="1" selected>正常</option><option value="2">2 倍</option></select></label></div><div id="live" aria-live="polite"></div><p class="note">每段展示 12 秒，可自動重播。靶兵生命提高、停止行軍；攻擊與特效使用現有戰鬥程式。此頁不讀寫遊戲存檔，也不消耗物品。</p></section><aside><label for="search">找武將／兵種</label><input id="search" placeholder="例如：關羽、龐統、槍"><label for="hero">展示角色</label><select id="hero"></select><div id="summary"></div><label for="direction">攻擊方向</label><select id="direction"><option value="right">向右</option><option value="down">向下</option><option value="left">向左</option><option value="up">向上</option></select><div id="modes" class="skill-buttons"></div><p><label><input id="loop" type="checkbox" checked style="width:auto;min-height:0"> 自動重播</label></p><div id="description"></div></aside></div></main>
<div hidden><select id="size"><option value="10x6">10x6</option></select><button id="play"></button><button id="reset"></button><button id="move"></button><button id="remove"></button><span id="length"></span><span id="dimension"></span><span id="count"></span><span id="selection"></span><div id="cards"></div><div id="status"></div><div id="details"></div><dialog id="detailsDialog"></dialog></div>
<script>window.TutorialBattleConfig={health:1,attack:1};</script><script src="戰場路線.js"></script><script src="障礙地形.js"></script><script src="自然地表.js"></script><script src="地形美術.js"></script><script src="測試角色.js"></script><script src="武將戰鬥能力資料.js"></script><script src="蜀國武將技能資料.js"></script><script src="蜀國武將技能.js"></script><script src="武將戰鬥換算.js"></script><script src="品質美術.js"></script><script src="攻擊美術.js"></script><script src="角色戰鬥.js"></script><script src="凌氏戰鬥.js"></script><script src="武器技能展示.js"></script><script src="行旅手冊導覽.js"></script></body></html>
