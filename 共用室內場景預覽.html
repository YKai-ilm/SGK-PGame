<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>共用室內場景預覽</title><link rel="stylesheet" href="遊戲字體.css"><style>*{box-sizing:border-box}body{margin:0;background:#eae6d8;color:#263e33;font-family:DFKai-SB,serif}header{padding:max(24px,env(safe-area-inset-top)) 14px 12px;max-width:1000px;margin:auto}h1{font-size:22px;margin:0 0 10px}a{color:inherit}button,select{font:inherit;color:inherit;border:1px solid #a7ad90;border-radius:6px;background:#f8f2e3;padding:8px;cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}main{max-width:1000px;margin:auto;display:grid;grid-template-columns:minmax(0,620px) 1fr;gap:18px;padding:0 14px 20px}.map{position:relative;width:100%;aspect-ratio:2/3;container-type:inline-size}.map img{width:100%;height:100%;object-fit:contain;display:block}.sign{position:absolute;transform:translate(-50%,-50%);height:3.6%;padding:.55cqw .75cqw;min-width:11%;border:.18cqw solid #eee1b6;border-radius:.55cqw;background:#a78e58;box-shadow:0 .35cqw .7cqw #242f2880;font-size:2.7cqw;font-weight:bold;line-height:1;white-space:nowrap}.sign span{display:grid;place-items:center;height:100%;padding:0 1cqw;background:#f7ecd1}.sign::after{content:'';position:absolute;inset:-8px}.hidden-point{position:absolute;transform:translate(-50%,-50%);padding:0;border:0;background:transparent;box-shadow:none;cursor:pointer}.hidden-point:focus-visible{outline:2px dashed #f4e1a4}.map.clean .hidden-point{display:none}.npc{background:#a78e58}.npc.historical{background:#2d6562}.map.clean .sign{display:none}aside{line-height:1.8}aside h2{margin-top:0;font-size:22px}.note{font-size:14px;color:#666f53}dialog{width:min(440px,92vw);border:2px solid #9daa84;border-radius:10px;background:#f7f0df;color:#263e33;font:inherit;line-height:1.8}dialog::backdrop{background:#20342688}dialog button{float:right}#all{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:1000px;margin:0 auto 30px;padding:14px}#all a{text-decoration:none}#all img{width:100%;display:block;border-radius:5px}#all span{display:block;text-align:center;padding:6px;font-size:15px}@media(max-width:700px){main{display:block;padding:0 8px}aside{padding:12px 8px}#all{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}nav select{max-width:50%}}</style></head><body><header><h1>共用室內場景 · 建議圖</h1><nav><a id="returnOrigin" href="劇情場景圖鑑.html">返回場景圖鑑</a><select id="scene" aria-label="場景"></select><button id="cards">顯示字卡示意</button><a href="#all">總覽</a><a href="劇情場景圖鑑.html">場景圖鑑</a></nav></header><main><div class="map clean" id="map"><img id="background" alt=""><button class="sign npc" id="npc"><span></span></button><button class="sign" id="exit"><span>離開</span></button></div><aside><h2 id="title"></h2><p>各城市共用的無人物底圖。NPC 字卡、姓名、對話與事件由城市資料另行配置。</p><p class="note">字卡只作位置示意，沒有把人物畫進底圖；商店與劇情尚未啟用。</p><p id="special"></p><p><a href="徐州劇情分流草案.txt">查看劇情分流與書吏規則</a></p><a id="original" target="_blank">查看原圖</a></aside></main><section id="all"></section><dialog id="detail"><h2 id="speaker"></h2><p id="line"></p><form method="dialog"><button>關閉</button></form></dialog><script src="人物字卡樣式.js?v=20261111-mi-name"></script><script src="共用室內場景資料.js"></script><script src="徐州字卡配置.js?v=20261111-mi-name"></script><script src="城池場景導航.js"></script><script>const originContext=CitySceneNavigation.context(),cityMode=originContext.cityId==="xuzhou";const $=id=>document.getElementById(id),scenes=cityMode?[...SharedInteriorScenes.filter(s=>XuzhouNpcPlacement[s.id]).map(s=>({...s,...XuzhouNpcPlacement[s.id]})),XuzhouNpcPlacement['城西']]:SharedInteriorScenes;$('returnOrigin').href=CitySceneNavigation.destination(originContext);$('returnOrigin').textContent=CitySceneNavigation.label(originContext);if(cityMode){$('map').classList.remove('clean');$('cards').textContent='隱藏字卡';document.querySelector('h1').textContent='徐州城 · 人物配置';document.querySelector('aside>p').textContent='點字卡查看人物台詞，使用出口字卡返回徐州內城。';document.querySelector('.note').textContent='已配置字卡位置；任務、交易、住宿與訓練功能尚待接入。';}for(const s of scenes){const o=document.createElement('option');o.value=s.id;o.textContent=s.name;$('scene').append(o);const a=document.createElement('a');a.href=CitySceneNavigation.sceneURL(s.id,originContext);const im=document.createElement('img');im.src=s.image;im.alt=s.name;im.loading='lazy';const label=document.createElement('span');label.textContent=s.name;a.append(im,label);$('all').append(a)}function show(id){const s=scenes.find(x=>x.id===id)||scenes[0];document.querySelectorAll('[data-extra-place]').forEach(el=>el.remove());for(const place of s.places||[]){const b=document.createElement('button');b.className=place.hidden?'hidden-point':'sign';b.setAttribute('aria-label',place.name);b.dataset.extraPlace=place.id;b.style.cssText='left:'+place.x+'%;top:'+place.y+'%';if(place.hidden){b.style.width=(place.width||9)+'%';b.style.height=(place.height||6)+'%';}else{const span=document.createElement('span');span.textContent=place.name;b.append(span);}b.onclick=()=>{$('speaker').textContent=place.name;$('line').textContent=place.description;$('detail').showModal();};$('map').append(b);}$('scene').value=s.id;$('background').src=s.image;$('background').alt=s.name+'共用底圖';$('title').textContent=s.name;$('original').href=s.image;$('npc').firstElementChild.textContent=s.npc;$('npc').classList.toggle('historical',CharacterCardStyle.isHistorical(s.npc));$('npc').style.cssText='left:'+s.npcX+'%;top:'+s.npcY+'%';$('exit').firstElementChild.textContent=s.id==='城西'?'回內城':'離開';$('exit').style.cssText='left:'+s.exitX+'%;top:'+s.exitY+'%';$('special').textContent=s.id==='役所'?'書吏：優先觸發劇情，其次提供任務提醒，無待辦劇情時介紹該城市的 NPC。':s.id.startsWith('城主府')?'版本一、二採中央高臺與左右後廳／側院通道；版本三為方正議事廳，保留後廳通道與側院走廊。':'';if(cityMode)$('special').textContent=s.note||'各店鋪櫃檯配置一名常駐 NPC。';history.replaceState(null,'',CitySceneNavigation.sceneURL(s.id,originContext))}$('scene').onchange=()=>show($('scene').value);$('cards').onclick=()=>{$('map').classList.toggle('clean');$('cards').textContent=$('map').classList.contains('clean')?'顯示字卡示意':'隱藏字卡'};$('exit').onclick=()=>location.href=CitySceneNavigation.destination(originContext);$('npc').onclick=()=>{const s=scenes.find(x=>x.id===$('scene').value);$('speaker').textContent=s.npc;$('line').textContent=cityMode?s.line:s.id==='役所'?'有劇情時先進行劇情交談；劇情完成後，這裡可介紹本城目前可遇見的人物與位置。':'這是人物位置示意；實際姓名與對話依城市和劇情配置。';$('detail').showModal()};show(new URLSearchParams(location.search).get('scene'));</script><script src="行旅手冊導覽.js"></script></body></html>
