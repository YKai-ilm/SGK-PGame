<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字卡泡泡球｜訓練所</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#ece9da;color:#294234;font:16px/1.6 system-ui,'Microsoft JhengHei',sans-serif}main{max-width:560px;margin:auto;padding:16px}h1{font-size:26px;margin:0}header,.stats,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}a{color:#285e50}button{font:inherit;padding:10px 14px;border:1px solid #a7b399;border-radius:8px;background:#faf8eb;color:#294234;cursor:pointer}button:disabled{opacity:.5}#start{background:#315541;color:white}.panel{background:#faf7e9;border:1px solid #bec6af;border-radius:12px;padding:15px;margin:12px 0}.stats b{font-size:24px}.targets{font-size:18px;color:#765d23}canvas{display:block;width:100%;aspect-ratio:395/470;object-fit:contain;background:linear-gradient(#233e34,#3e614c);border-radius:12px;touch-action:none}#message{min-height:28px}#error{color:#a12e22}dialog{max-width:90vw;border:1px solid #849477;border-radius:12px;background:#faf7e9;color:#294234}dialog::backdrop{background:#0008}p{margin:8px 0}.hint{font-size:14px;color:#64705d}:focus-visible{outline:3px solid #bf8f35}#board:focus{outline:3px solid #bf8f35}@media(max-width:420px){main{padding:10px}.panel{padding:10px}h1{font-size:23px}}
</style></head><body><main><header><h1>字卡泡泡球</h1><a href="徐州劇情.html">返回訓練所</a><a href="行旅手冊.html#growth">行旅手冊</a></header><section class="panel" id="intro"><p>開場三排排滿字球，不提供姓名提示。45秒內，自己觀察字陣，將有字的球射向上方，相鄰字球依序組成同陣營武將姓名即可消除，每個姓名100分。可斜向連接，也能由右向左讀。</p><p>拖曳瞄準、放開發射；兩側牆壁可反彈。也可用方向鍵瞄準、空白鍵發射。</p><p>每局100金幣。完成獲得同陣營隨機武將碎片×2（徐州：一級寶箱品質範圍）及20～60可分配經驗。每100分多5經驗，最多60。</p><p class="hint">數值為首版配置。離開或切換視窗仍會倒數，返回可接續／結算；提前放棄無獎勵且不退費。</p><p id="balance"></p><button id="start">花費100金幣，開始訓練</button></section><section id="play" hidden><div class="stats"><span>剩餘 <b id="time">45</b> 秒</span><span>積分 <b id="score">0</b></span><span id="faction"></span></div><canvas id="board" width="395" height="470" tabindex="0" aria-label="字卡泡泡球場地，左右方向鍵瞄準，空白鍵發射"></canvas><p id="message" role="status" aria-live="polite"></p><div class="actions"><button id="swap">交換下一球</button><button id="abandon">放棄本局</button></div></section><section class="panel" id="result" hidden></section><p id="error" role="alert"></p><dialog id="confirm"><p>確定放棄？本局不發獎勵，也不退還100金幣。</p><button id="yes">確定放棄</button><button id="no">繼續訓練</button></dialog></main><script src="人物評定草案.js"></script><script src="武將品質草案.js"></script><script src="任務成就.js"></script><script src="寶箱系統.js"></script><script src="字卡泡泡球資料.js?v=20261111-three-rows"></script><script src="字卡泡泡球.js?v=20261111-three-rows"></script></body></html>
