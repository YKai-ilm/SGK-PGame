<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>存檔備份｜三國走圖塔防</title><style>body{background:#f4f0e3;color:#294234;font:18px/1.8 system-ui;margin:0;padding:24px;box-sizing:border-box}main{max-width:640px;margin:auto}a{color:#294234}section{background:#fffcf2;padding:20px;border:1px solid #bbc3a8;border-radius:12px;margin:18px 0}button,input{font:inherit;max-width:100%;box-sizing:border-box}button{padding:12px 18px;background:#294234;color:white;border:0;border-radius:7px;margin:6px 0;cursor:pointer}button:disabled{opacity:.5}#summary{white-space:pre-line}#message{color:#71451c}small{display:block}dialog{max-width:85vw;background:#fffcf2;color:#294234;border:1px solid #9da889;border-radius:12px}h1{font-size:30px}</style><script src="完整存檔.js"></script><script src="背景音樂.js" data-scene="home"></script></head><body><main><a href="主介面流程預覽.html">‹ 回主城</a><h1>把旅程好好收著</h1><p>平常自動保存在這個裝置與瀏覽器。換手機、改用主畫面版或日後 App 前，請先匯出備份。</p><section><h2>匯出完整進度</h2><p>包含已保存的劇情、字卡、碎片、裝備、道具、隊伍及戰鬥進度。正在進行的戰鬥請先使用戰場「存檔」。</p><button id="export">匯出備份檔案</button><button id="share" hidden>分享／存到檔案</button><small>下載完成後，可自行存入 Google 雲端硬碟。不會自動上傳到任何帳號。</small></section><section><h2>從備份繼續</h2><input id="file" aria-label="選擇完整進度備份" type="file" accept=".json,application/json"><p id="summary">先選擇檔案查看內容；選擇檔案不會覆蓋進度。</p><button id="import" disabled>確認覆蓋本機進度</button><small>匯入會替換此瀏覽器的遊戲進度，其他開啟中的遊戲頁也需重新載入。</small></section><section><h2>恢復副本</h2><p>每次匯入前保留上一份本機進度。它仍在同一裝置，不能取代匯出檔案。</p><button id="previous">匯出上次覆蓋前的進度</button></section><p id="message" role="status"></p><small id="version"></small><dialog id="confirm"><h2>恢復這份旅程？</h2><p>將覆蓋此瀏覽器目前的進度，請確認其他裝置需要的進度已另行備份。</p><button id="yes">確認恢復</button><button id="no">取消</button></dialog></main><script src="存檔備份介面.js"></script></body></html>
