<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>特殊稱號與羈絆候選</title><link rel="stylesheet" href="遊戲字體.css"><style>*{box-sizing:border-box}body{margin:0;background:#eee9da;color:#263e33;font:18px/1.65 serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:28px}a{color:#456b42}.note,article{background:#faf7ed;border:1px solid #bcc4a8;border-radius:12px;padding:18px;margin:12px 0}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select,button{font:inherit;padding:8px;border:1px solid #87977e;border-radius:6px;background:#fffdf5;max-width:100%}input{flex:1;min-width:0}#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}article{margin:0}h2{font-size:23px;margin:0}small{color:#58664f}p{margin:8px 0}.tag{background:#e0e2d8;padding:3px 8px;border-radius:4px}#count{margin:12px 0}@media(max-width:650px){main{padding:14px}#list{grid-template-columns:1fr}}</style><main><a href="全武將能力複核.html">← 能力複核</a> · <a href="武將名單補漏.html">首批40人補漏</a><h1>特殊稱號與羈絆候選</h1><p><a href="補充武將能力評定.html">76名補充武將：查看六維、品質與評定理由 →</a></p><section class="note"><strong>18組特色方向・額外36名補漏候選</strong><p>曹植已在原有240人中，這次補七步之才的設計方向。凌操、董允等沿用首批40人名單，不重複建卡。</p><p>本頁是研究與效果提案，尚未套用戰鬥；76名新人物已完成六維與品質初評，可由上方入口查看。</p><details><summary>共同規則與模式限制</summary><ul id="rules"></ul></details><p>南中新增10人：祝融、兀突骨、孟獲等暫歸群雄。蜀國南征劇情登場不等於可編入蜀國隊伍；演義設定與史料記載分開標記。</p><p id="extra"></p></section><nav><input id="search" aria-label="搜尋稱號與人物" placeholder="搜尋曹植、二喬、四相……"><select id="type" aria-label="類型"><option value="">所有類型</option><option>個人特性</option><option>多人羈絆</option></select></nav><p id="count" role="status"></p><section id="list"></section></main><script src="特殊稱號與羈絆候選資料.js"></script><script>
const D=window.BOND_CANDIDATES,$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('rules').innerHTML=D.rules.map(s=>'<li>'+esc(s)+'</li>').join('');$('extra').textContent='額外候選：'+D.additionalCandidates.map(x=>x.name+'（'+x.faction+'）').join('、');
function render(){const q=$('search').value.trim(),t=$('type').value,rows=D.entries.filter(x=>(!t||x.type===t)&&(!q||JSON.stringify(x).includes(q)));$('count').textContent='顯示 '+rows.length+'／18 組';$('list').innerHTML=rows.map(x=>'<article><h2>'+esc(x.title)+'</h2><p class="tag">'+esc(x.type)+' · '+esc(x.evidence)+'</p><p>'+x.members.map(m=>esc(m.name)+'（'+esc(m.status)+'）').join('、')+'</p><p>'+esc(x.notes)+'</p><p><strong>效果提案：</strong>'+esc(x.effect)+'</p><p><strong>觸發限制：</strong>'+esc(x.limits)+'</p><a target="_blank" rel="noopener" href="'+esc(x.source.url)+'">來源：'+esc(x.source.title)+'</a></article>').join('');}for(const id of ['search','type'])$(id).addEventListener('input',render);render();</script></html>
