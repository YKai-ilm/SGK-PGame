<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大地圖字框位置編輯</title><link rel="stylesheet" href="大地圖字框編輯.css"></head><body>
<header><div><h1>大地圖字框位置編輯</h1><p>拖動字框安排位置；拖動空白處移動地圖。名稱稍後可改。</p></div><div class="actions"><button id="add">＋ 新增字框</button><button id="export" class="primary">下載位置檔</button><button id="copy">複製位置資料</button><label class="button">匯入位置檔<input id="import" type="file" accept=".json,application/json" hidden></label></div></header>
<main><section class="map-area"><div id="viewport"><div id="sizer"><div id="world"><img src="三國大地圖-候選-v1.webp" alt="使用者指定沿用的首版三國大地圖" draggable="false"><div id="labels"></div></div></div></div><div class="zoom"><button id="minus" aria-label="縮小">−</button><span id="zoomText"></span><button id="plus" aria-label="放大">＋</button><button id="fit">全圖</button><button id="actual">原尺寸</button></div><span id="status" role="status">位置會自動暫存在本機</span></section>
<aside><h2>字框設定</h2><p class="note">沿用你第十六版的配置，新增「下曲陽」，共 80 個地點。暫放廣宗左上方、冀州左側偏上；可拖曳後下載位置檔。</p><label>目前選取<select id="selection"></select></label><label class="size-control">全部字框大小 <output id="allSizeValue">75%</output><input id="allSize" type="range" min="40" max="160" step="5" value="75"></label><label class="size-control">選取字框大小 <output id="labelSizeValue">75%</output><input id="labelSize" type="range" min="40" max="160" step="5" value="75"></label><label>城池名稱<input id="name" maxlength="24" placeholder="輸入城池名稱"></label><div class="row"><label>橫向位置 %<input id="x" type="number" min="0" max="100" step="0.1"></label><label>縱向位置 %<input id="y" type="number" min="0" max="100" step="0.1"></label></div><div class="row"><button id="locate">定位字框</button><button id="remove">刪除選取</button><button id="undo">復原</button></div><hr><label>批次加入名稱<textarea id="names" rows="4" placeholder="每行一個名稱；也可用頓號分隔"></textarea></label><button id="batch">加入這些字框</button><p class="note">完成後按「下載位置檔」，把下載的 JSON 檔傳回對話，我就能照你的配置調整。位置與大小都會一併匯出。只有這個編輯頁的草稿會儲存，不影響遊戲進度。</p><p id="count"></p></aside></main>
<dialog id="copyDialog"><h2>位置資料</h2><p>若瀏覽器不允許自動複製，請選取以下文字複製，或下載位置檔。</p><textarea id="copyText" rows="10" readonly></textarea><button id="closeCopy">關閉</button></dialog><script src="大地圖字框編輯.js"></script></body></html>
