<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>武將名單補漏・首批40人</title><link rel="stylesheet" href="遊戲字體.css"><style>*{box-sizing:border-box}body{margin:0;background:#eee9da;color:#263e33;font:18px/1.65 serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:28px}a{color:#456b42}.note,article{background:#faf7ed;border:1px solid #bcc4a8;border-radius:12px;padding:18px;margin:12px 0}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select,button{font:inherit;padding:8px;border:1px solid #87977e;border-radius:6px;background:#fffdf5;max-width:100%}input{flex:1;min-width:0}#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}article{margin:0}h2{font-size:23px;margin:0}small{color:#58664f}p{margin:8px 0}.tag{background:#e0e2d8;padding:3px 8px;border-radius:4px}#count{margin:12px 0}@media(max-width:650px){main{padding:14px}#list{grid-template-columns:1fr}}</style></head><body><main><a href="全武將能力複核.html">← 返回能力複核</a><h1>武將名單補漏・首批40人</h1><p><a href="補充武將能力評定.html">76名補充武將：查看六維、品質與評定理由 →</a></p><p><a href="特殊稱號與羈絆候選.html">特殊稱號與羈絆：18組方向、36名額外補漏候選 →</a></p><section class="note"><strong>原有240人＋40名補漏候選</strong><p>凌操等人已列入本輪補漏名單。這40人尚未加入正式能力表、抽卡池或玩家持有卡。</p><p>本輪先整理身分與來源索引，完整事蹟仍待逐人詳核。六維與品質已完成初評；以下定位是建議方向，不是已實裝技能。</p><p>主陣營用於五陣營卡庫歸類；跨勢力經歷保留說明，劇情登場年代另行限制。異名只算同一人。</p><p>吳10人・魏10人・蜀8人・群雄6人・東漢6人</p></section><nav><input id="search" aria-label="搜尋候選" placeholder="姓名、異名、身分或定位"><select id="faction" aria-label="陣營"><option value="">五陣營</option><option>魏</option><option>蜀</option><option>吳</option><option>群雄</option><option>東漢</option></select><button id="download">下載40人名單</button></nav><p id="count" role="status"></p><section id="list"></section></main><script src="首批武將補漏名單資料.js?v=20261108-1"></script><script>
const D=window.ROSTER_ADDITIONS,$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=$('search').value.trim(),f=$('faction').value,rows=D.entries.filter(x=>(!f||x.faction===f)&&(!q||[x.name,x.identity,x.suggestedRole,...x.aliases].join(' ').includes(q)));$('count').textContent='顯示 '+rows.length+'／40名候選 · 能力與品質初評完成';$('list').innerHTML=rows.map(x=>'<article><h2>'+esc(x.name)+' <small>'+esc(x.faction)+'</small></h2><span class="tag">'+esc(x.status)+'</span><p>'+esc(x.identity)+'</p><p>建議定位：'+esc(x.suggestedRole)+'</p><p>姓名拆字：'+x.letters.map(esc).join('・')+'</p>'+(x.aliases.length?'<p>異名：'+x.aliases.map(esc).join('、')+'（不另建卡）</p>':'')+'<p><a target="_blank" rel="noopener" href="'+esc(x.source.url)+'">'+esc(x.source.title)+' · 來源索引</a></p><small>六維與品質：已初評，請見上方評定頁</small></article>').join('');}for(const id of ['search','faction'])$(id).addEventListener('input',render);$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='首批武將補漏名單.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};render();</script><script src="行旅手冊導覽.js"></script></body></html>
