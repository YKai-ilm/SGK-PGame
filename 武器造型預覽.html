<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>武器造型與動作對照</title><style>body{background:#eee9dc;color:#253d31;font:14px system-ui;margin:20px}h1{font-size:23px}button{padding:8px 14px;background:#f8f4e8;color:#253d31;border:1px solid #b8bea8;border-radius:6px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;max-width:1200px}.item{background:#f8f4e8;border:1px solid #c9ceb7;padding:10px;border-radius:8px}h2{font-size:16px;margin:0 0 8px}canvas{display:block;width:100%;border-radius:5px}p{color:#64725d}</style><link rel="stylesheet" href="遊戲字體.css?v=20261107-1"></head><body><h1>武器造型與動作對照</h1><p>使用與戰場相同的武器繪製。放大查看材質；原比例查看實際辨識度。</p><p><button id="scale">切換原比例</button> <button id="pause">暫停動作</button></p><main></main><script src="自然地表.js?v=20261108-road-full"></script><script src="地形美術.js?v=20261108-brighter-ground"></script><script src="品質美術.js?v=20261108-four-name"></script><script src="攻擊美術.js?v=20261109-edge-center"></script><script>
window.BoardObjectScale=.65;let large=true,paused=false,phase=.5;const items=[['劉備','雙股劍 · 交錯揮斬','hit'],['關羽','青龍偃月刀 · 長柄橫掃','hit'],['張飛','丈八蛇矛 · 重刺','pierce'],['趙雲','銀槍 · 輕快突刺','pierce'],['刀','普通短刀','hit'],['槍','普通長槍','pierce'],['弓','木弓','arrow'],['諸葛亮','羽扇','magic']];const ground=TerrainArt.render(9,[{x:1,y:1},{x:2,y:1}],.5,9,.65);const panels=items.map(([name,label,kind])=>{const el=document.createElement('section');el.className='item';el.innerHTML='<h2>'+name+'｜'+label+'</h2><canvas width="380" height="210"></canvas>';document.querySelector('main').append(el);return{c:el.querySelector('canvas').getContext('2d'),name,kind};});document.getElementById('scale').onclick=e=>{large=!large;e.target.textContent=large?'切換原比例':'放大查看'};document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'繼續動作':'暫停動作'};function render(t){if(!paused)phase=(t%1600)/1600;const p=window.previewPhase??phase;for(const {c,name,kind}of panels){c.drawImage(ground,150,250,380,210,0,0,380,210);const s=large?140:55,u={type:name,x:110/s-.5,y:105/s-.5,weapon:{kind,start:0,duration:1,angle:0}};c.textAlign='center';c.textBaseline='middle';QualityArt.draw(c,u,110,105,s*.65,false);AttackArt.weapon(c,u,p,s);}requestAnimationFrame(render);}requestAnimationFrame(render);
</script><script src="行旅手冊導覽.js"></script></body></html>
