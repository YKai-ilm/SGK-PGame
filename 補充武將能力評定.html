<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>76名補充武將能力評定</title><link rel="stylesheet" href="遊戲字體.css"><style>*{box-sizing:border-box}body{margin:0;background:#eee9da;color:#263e33;font:18px/1.65 serif}main{max-width:1150px;margin:auto;padding:20px}a{color:#456b42}h1{font-size:28px}h2{margin:0;font-size:24px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}input,select,button{font:inherit;padding:8px;max-width:100%;border:1px solid #87977e;border-radius:6px;background:#fffdf5}input{min-width:0;flex:1}.note,article{background:#faf7ed;border:1px solid #bcc4a8;border-radius:12px;padding:16px}#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quality{padding:2px 10px;border-radius:5px;color:#192b23}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.stats div{background:#ebe8d9;text-align:center;border-radius:5px;padding:5px}p{margin:9px 0}small{color:#55634c}#sources a{overflow-wrap:anywhere}@media(max-width:650px){main{padding:12px}#list{grid-template-columns:1fr}}</style></head><body><main><a href="全武將能力複核.html">原240人複核</a> · <a href="特殊稱號與羈絆候選.html">稱號與羈絆</a><h1>76名補充武將・能力品質初評</h1><section class="note"><p>本頁已設定六維及原始品質，數值為遊戲設計初評，不是史書原值。人物來源索引與評定理由均保留；完整傳記詳核與平衡測試仍可修正。</p><p>品質直接使用既有公式：符合多項時取最高，門檻包含等於，平均不先取整數。金色只由轉生取得。</p><p>文才、醫術、工巧與演義術法會另由特性表現，不代表具有同等軍略或前線能力。體魄與敏捷缺乏明確記載時標為設計估值。</p><p>原240人的數值保持不變；這76人尚未加入正式抽卡池，也未授予玩家。</p><strong id="summary"></strong></section><nav><input id="search" aria-label="搜尋武將" placeholder="姓名、異名、評定理由"><select id="faction" aria-label="陣營"><option value="">五陣營</option><option>魏</option><option>蜀</option><option>吳</option><option>群雄</option><option>東漢</option></select><select id="quality" aria-label="品質"><option value="">所有品質</option><option>青</option><option>綠</option><option>藍</option><option>橘</option><option>紅</option><option>紫</option></select><select id="sort" aria-label="排序"><option value="original">原名單順序</option><option value="quality">品質高至低</option><option value="average">平均高至低</option></select><button id="download">下載評定</button></nav><p id="count" role="status"></p><section id="list"></section></main><script src="武將品質草案.js"></script><script src="補充武將能力評定資料.js?v=20261108-import32"></script><script>
const D=window.ADDITIONAL_OFFICERS,Q=window.OFFICER_QUALITY,$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('summary').textContent=Q.tiers.filter(x=>x!=='金').map(t=>t+' '+D.entries.filter(x=>x.quality===t).length+'人').join('・');
function render(){const q=$('search').value.trim(),f=$('faction').value,t=$('quality').value,rows=D.entries.filter(x=>(!f||x.faction===f)&&(!t||x.quality===t)&&(!q||[x.name,...x.aliases,x.assessmentReason].join(' ').includes(q)));if($('sort').value==='average')rows.sort((a,b)=>b.average-a.average);if($('sort').value==='quality')rows.sort((a,b)=>Q.tiers.indexOf(b.quality)-Q.tiers.indexOf(a.quality)||b.average-a.average);$('count').textContent='顯示 '+rows.length+'／76 人';$('list').innerHTML=rows.map(x=>'<article><h2>'+esc(x.name)+' <small>'+esc(x.faction)+'</small> <span class="quality" style="background:'+Q.colors[x.quality]+'">'+x.quality+'</span></h2><div class="stats">'+Object.entries(D.fields).map(([k,label])=>'<div>'+label+' <b>'+x.abilities[k]+'</b></div>').join('')+'</div><p><strong>評定：</strong>'+esc(x.assessmentReason)+'</p><p><strong>品質依據：</strong>'+esc(x.qualityReason)+'</p><small>'+esc(x.confidence)+'</small>'+(x.aliases.length?'<p>異名：'+x.aliases.map(esc).join('、')+'</p>':'')+'<p>'+x.references.map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a>').join(' · ')+'</p></article>').join('');}for(const id of ['search','faction','quality','sort'])$(id).addEventListener('input',render);$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='補充武將能力評定.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};render();
</script><script src="行旅手冊導覽.js"></script></body></html>
