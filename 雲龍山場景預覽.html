<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雲龍山・場景預覽</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#29372b;color:#f7f1db;font-family:serif}body{display:flex;flex-direction:column;overflow:hidden}header{padding:10px 14px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;flex-shrink:0}h1{font-size:20px;margin:0}a{color:inherit}small{color:#d8dfc9}main{min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain}.map{width:100%;max-width:724px;margin:auto}.map img{display:block;width:100%;height:auto}footer{padding:7px 14px;font-size:13px;flex-shrink:0;background:#243024}button{font:inherit;border:1px solid #b8c4a1;background:#e9ecd9;color:#294236;border-radius:4px;padding:4px 12px;cursor:pointer}@media print{body{height:auto;overflow:visible}main{overflow:visible}header button,footer{display:none}}</style></head>
<body><header><h1>雲龍山</h1><small>場景初稿・上下滑動查看</small><button id="foot" type="button">山腳</button><button id="top" type="button">山頂</button><a href="行旅手冊.html#scenes">行旅手冊</a></header>
<main id="view" tabindex="0" aria-label="雲龍山縱向場景，可上下捲動"><div class="map"><img id="scene" src="雲龍山縱向場景-v3.png" width="724" height="2172" alt="雲龍山山腳通往高處的山徑，沿途有坡道、石階、通往獨立岩台的木梯與林間空地"></div></main>
<footer>底圖預覽；人物與探索事件待配置。</footer>
<script>const view=document.getElementById('view'),scene=document.getElementById('scene');function foot(){view.scrollTop=view.scrollHeight}document.getElementById('foot').onclick=foot;document.getElementById('top').onclick=()=>{view.scrollTop=0};if(scene.complete)foot();else scene.addEventListener('load',foot,{once:true});</script></body></html>
