<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戰場20種路線總覽</title><link rel="stylesheet" href="遊戲字體.css"><style>*{box-sizing:border-box}body{margin:0;background:#eeeada;color:#253e32;font-family:DFKai-SB,serif}main{max-width:1250px;margin:auto;padding:20px}h1{font-size:28px}p{line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}article{border:1px solid #abb89b;background:#faf7ed;border-radius:12px;padding:12px}h3{font-size:19px;margin:0 0 8px}canvas{width:100%;height:auto;display:block;border-radius:8px}small{display:block;line-height:1.7;margin-top:8px}a{color:#456b52}section{margin-bottom:28px}</style><main><h1>戰場路線 · 20種版本</h1><p>尺寸以「橫向欄數 × 縱向列數」計。紅旗營帳為敵軍入口，城樓為終點。路線固定、岩壁與森林禁止部署；城門及入口保留。一般1、一般2與直版關卡1沿用你提供的配置；其餘路線按彎道安排連片地形，保留城前與另一側部署空間。環圈敵軍不無限循環。城池後方禁止部署。</p><p><a href="戰場直版.html">戰場試玩</a> · <a href="戰場直版.html?storySweep=1">桃園村掃蕩</a></p><div id="maps"></div></main><script src="自然地表.js?v=20261108-road-full"></script><script src="地形美術.js?v=20261108-brighter-ground"></script><script src="障礙地形.js?v=20261109-maps-items-safe"></script><script src="戰場配置資料.js?v=20261109-maps"></script><script src="戰場路線.js?v=20261109-maps-items-safe"></script><script>
for(const size of BattleRoutes.sizes){const [w,h]=size.split('x').map(Number),section=document.createElement('section');section.innerHTML='<h2>'+(['6x10','10x6'].includes(size)?'一般戰鬥':'關卡戰鬥')+' · '+w+' × '+h+'</h2><div class="grid"></div>';document.getElementById('maps').append(section);for(const type of BattleRoutes.available(w,h)){const road=BattleRoutes.build(w,h,type),blocks=TerrainObstacles.build(w,h,road),art=TerrainArt.render(w,road,.5,h,1.05,blocks),card=document.createElement('article');card.innerHTML='<h3>'+BattleRoutes.names[type]+'</h3>';card.append(art);const note=document.createElement('small');note.textContent=((window.BattleMapPresets||[]).find(m=>m.cols===w&&m.rows===h&&m.id===type)?.source||'')+' · 道路 '+road.length+' 格 · 障礙 '+blocks.length+' 格 · 非道路空地 '+(w*h-road.length-blocks.length)+' 格';card.append(note);section.querySelector('.grid').append(card);}}
</script></html>
